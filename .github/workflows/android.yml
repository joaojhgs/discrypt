name: android build and media gate

on:
  workflow_dispatch:
    inputs:
      run_android_emulator:
        description: Build the Android APK and run the voice media path on an Android emulator runner
        type: boolean
        default: true
  pull_request:
    paths:
      - .github/workflows/android.yml
      - "apps/desktop/package*.json"
      - apps/desktop/src-tauri/**
      - apps/ui/**
      - crates/media/**
      - scripts/*android*.mjs
      - docs/release/android-build-emulator-gate.md

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  validate-android-gate:
    name: validate Android build and media gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.96.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: |
            apps/ui/package-lock.json
            apps/desktop/package-lock.json
      - run: npm --prefix apps/ui ci --audit=false
      - run: npm --prefix apps/ui run test:android-gate
      - run: cargo test -p discrypt-media android --quiet
      - run: cargo test -p discrypt-media voice --quiet
      - run: npm --prefix apps/ui run test:honesty
      - run: npm --prefix apps/ui run test:command-coverage
      - run: npm --prefix apps/ui run build

  android-emulator-voice-path:
    name: Android emulator voice path
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_android_emulator }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      DISCRYPT_ANDROID_PACKAGE: chat.discrypt.desktop
      ANDROID_API_LEVEL: "35"
      ANDROID_NDK_VERSION: "28.0.13004108"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.96.0
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: |
            apps/ui/package-lock.json
            apps/desktop/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK and NDK packages
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-${ANDROID_API_LEVEL}" \
            "build-tools;35.0.0" \
            "ndk;${ANDROID_NDK_VERSION}" \
            "emulator" \
            "system-images;android-${ANDROID_API_LEVEL};google_apis;x86_64"
          ndk_home="${ANDROID_HOME}/ndk/${ANDROID_NDK_VERSION}"
          llvm_bin="${ndk_home}/toolchains/llvm/prebuilt/linux-x86_64/bin"
          {
            echo "ANDROID_NDK_HOME=${ndk_home}"
            echo "NDK_HOME=${ndk_home}"
            echo "CC_x86_64_linux_android=${llvm_bin}/x86_64-linux-android${ANDROID_API_LEVEL}-clang"
            echo "AR_x86_64_linux_android=${llvm_bin}/llvm-ar"
            echo "CARGO_TARGET_X86_64_LINUX_ANDROID_LINKER=${llvm_bin}/x86_64-linux-android${ANDROID_API_LEVEL}-clang"
          } >> "$GITHUB_ENV"
      - run: npm --prefix apps/ui ci --audit=false
      - run: npm --prefix apps/desktop ci --audit=false
      - run: npm --prefix apps/ui run test:android-gate
      - run: cargo test -p discrypt-media android --quiet
      - run: cargo check -p discrypt-media --target x86_64-linux-android --quiet
      - run: npm --prefix apps/ui run test:honesty
      - run: npm --prefix apps/ui run test:command-coverage
      - run: npm --prefix apps/ui run build
      - name: Initialize generated Android project
        working-directory: apps/desktop
        run: >
          npm run tauri -- android init
          --ci
          --skip-targets-install
      - name: Build Android APK for emulator
        working-directory: apps/desktop
        run: >
          npm run tauri -- android build
          --ci
          --apk
          --target x86_64
          --features tauri-runtime,production-network,production-media
      - name: Sign APK for emulator installation
        shell: bash
        run: |
          set -euo pipefail
          unsigned_apk=$(find apps/desktop/src-tauri/gen/android/app/build/outputs/apk -type f -name '*-unsigned.apk' -print -quit)
          test -n "$unsigned_apk"
          emulator_keystore="$RUNNER_TEMP/discrypt-emulator.p12"
          signed_apk="${unsigned_apk%-unsigned.apk}-emulator-signed.apk"
          keytool -genkeypair -noprompt \
            -storetype PKCS12 \
            -keystore "$emulator_keystore" \
            -storepass android \
            -keypass android \
            -alias discrypt-emulator \
            -dname "CN=Discrypt Emulator,O=Discrypt,C=US" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign \
            --ks "$emulator_keystore" \
            --ks-pass pass:android \
            --key-pass pass:android \
            --out "$signed_apk" \
            "$unsigned_apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$signed_apk"
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          script: |
            set -euo pipefail
            APK_PATH=$(find apps/desktop/src-tauri/gen/android/app/build/outputs/apk -type f -name '*-emulator-signed.apk' -print -quit)
            test -n "$APK_PATH"
            adb install -r "$APK_PATH"
            adb shell pm grant "$DISCRYPT_ANDROID_PACKAGE" android.permission.BLUETOOTH_CONNECT
            adb shell pm grant "$DISCRYPT_ANDROID_PACKAGE" android.permission.RECORD_AUDIO
            adb shell appops set "$DISCRYPT_ANDROID_PACKAGE" RECORD_AUDIO allow
            adb shell am start -W -n "$DISCRYPT_ANDROID_PACKAGE/.MainActivity"
            sleep 12
            adb shell pidof "$DISCRYPT_ANDROID_PACKAGE"
            adb shell dumpsys package "$DISCRYPT_ANDROID_PACKAGE" > android-package-dump.txt
            grep -q "android.permission.BLUETOOTH_CONNECT: granted=true" android-package-dump.txt
            grep -q "android.permission.MODIFY_AUDIO_SETTINGS: granted=true" android-package-dump.txt
            grep -q "android.permission.RECORD_AUDIO: granted=true" android-package-dump.txt
            adb logcat -d > android-logcat.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: discrypt-android-emulator-voice-path
          path: |
            apps/desktop/src-tauri/gen/android/app/build/outputs/apk/**/*.apk
            android-package-dump.txt
            android-logcat.txt
